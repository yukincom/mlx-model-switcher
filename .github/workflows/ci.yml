name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install 'huggingface-hub==1.12.0'
      - name: Check launcher and frontend syntax
        run: |
          /bin/bash -n start_server.sh
          node --check src/mlx_activation_lab/server_web/app.js
          git diff --check
      - name: Test launcher, model guards, native HTTP and notifications
        run: python -m unittest discover -s tests -v
      - name: Test UI state and controls
        run: node --test tests/*.cjs
      - name: Build and verify the macOS application
        if: runner.os == 'macOS'
        run: |
          python tools/build_apps.py --python "$(command -v python)" --output "$RUNNER_TEMP/mlx-app"
          codesign --verify --deep --strict "$RUNNER_TEMP/mlx-app/MLX 8080.app"
          test ! -e "$RUNNER_TEMP/mlx-app/MLX 8080.app/Contents/Resources/src/mlx_activation_lab/server_manager_webapp.py"
