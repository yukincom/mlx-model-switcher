<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="server-token" content="__SERVER_TOKEN__">
  <title>MLX 8080</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-number">8080</span><span class="brand-copy"><strong>LOCAL MODELS</strong><small>LOCAL CONTROL</small></span></div>
    <span id="state-pill" class="pill">確認中</span>
  </header>
  <main>
    <div id="message" class="message hidden" role="status"></div>
    <section class="panel status-panel">
      <p class="eyebrow">SERVER STATUS / 127.0.0.1:8080</p>
      <h1 id="status-title">状態を確認中</h1>
      <div class="facts">
        <div><span>MODEL</span><strong id="model-name">—</strong></div>
        <div><span>PROCESS</span><strong id="process-id">—</strong></div>
      </div>
      <p id="status-detail" class="detail"></p>
      <div id="controls"></div>
    </section>
    <details class="panel models-panel">
      <summary class="section-title models-summary"><h2>モデル一覧</h2><select id="model-sort" aria-label="モデルの並び順"><option value="acquired">入手順（新しい順）</option><option value="size">サイズ順（大きい順）</option></select></summary>
      <div class="selection-toolbar" role="group" aria-label="選択したモデルの操作">
        <div class="selection-summary"><label class="select-all"><input id="select-all" type="checkbox">すべて選択</label><span id="selection-count">0件選択</span></div>
        <div class="model-actions"><button id="rename-selected" class="secondary" disabled>名称変更</button><button id="default-selected" class="secondary" disabled>デフォルトにする</button><button id="remove-selected" class="secondary" disabled>登録を外す</button><button id="delete-selected" class="secondary delete-body" disabled>本体も削除</button></div>
      </div>
      <div id="model-list" class="model-list"></div>
      <details class="register">
        <summary>保存済みモデルを追加</summary><button id="restore-gguf" type="button" class="secondary" hidden>保存済みGGUFモデルを一覧に戻す</button>
        <p class="registration-note">ダウンロード済みのモデルを選んで登録できます。新しくダウンロードした後は、一覧を更新してください。</p>
        <form id="register-form">
          <label>ダウンロード済みモデル<select id="cached-model" name="model" required disabled aria-describedby="cache-status"><option value="">読み込み中…</option></select></label>
          <p id="cache-status" class="input-help" role="status"></p>
          <div class="registration-actions"><button id="register-model" type="submit" disabled>起動リストに追加</button><button id="refresh-cache" type="button" class="secondary">一覧を更新</button></div>
        </form>
      </details>
    </details>
    <details class="panel log-panel">
      <summary class="section-title log-summary"><h2>起動ログ</h2><span>このアプリから起動した場合</span></summary>
      <pre id="log">ログはありません。</pre>
    </details>
  </main>
  <footer>外部起動した8080も検出します。停止時は対象プロセスを再確認します。</footer>
  <script src="/app.js"></script>
</body>
</html>
